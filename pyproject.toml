[project]
name = "careerpilot"
version = "0.1.0"
description = "CareerPilot Phase 1+2 monorepo backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16.0",
  "argon2-cffi>=25.1.0",
  "celery[redis]>=5.5.3",
  "email-validator>=2.3.0",
  "fastapi>=0.116.0",
  "httpx>=0.28.1",
  "langgraph>=0.6.0",
  "loguru>=0.7.3",
  "pydantic-settings>=2.10.0",
  "pymupdf>=1.26.0",
  "pyjwt>=2.10.1",
  "python-docx>=1.2.0",
  "python-multipart>=0.0.20",
  "sqlalchemy>=2.0.41",
  "uvicorn>=0.35.0",
]

[dependency-groups]
dev = [
  "pytest>=8.4.0",
  "pytest-asyncio>=1.0.0",
  "pytest-cov>=6.2.1",
  "ruff>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/api/src/careerpilot"]

[tool.hatch.build.targets.sdist]
include = [
  "apps/api/src/careerpilot",
  "apps/worker",
  "alembic.ini",
  "alembic",
]

[tool.pytest.ini_options]
pythonpath = ["apps/api/src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
